<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive two-player Tic-Tac-Toe game built with HTML, CSS and JavaScript.">
  <title>Tic-Tac-Toe | Aman Saini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="game-header" aria-labelledby="game-title">
      <p class="eyebrow">JavaScript Game</p>
      <h1 id="game-title">Tic-Tac-Toe</h1>
      <p class="status" aria-live="polite">Player O starts</p>
    </section>

    <section class="game" aria-label="Tic-Tac-Toe board">
      <button class="box" aria-label="Cell 1"></button>
      <button class="box" aria-label="Cell 2"></button>
      <button class="box" aria-label="Cell 3"></button>
      <button class="box" aria-label="Cell 4"></button>
      <button class="box" aria-label="Cell 5"></button>
      <button class="box" aria-label="Cell 6"></button>
      <button class="box" aria-label="Cell 7"></button>
      <button class="box" aria-label="Cell 8"></button>
      <button class="box" aria-label="Cell 9"></button>
    </section>

    <section class="controls">
      <button id="reset-btn" type="button">Reset Game</button>
      <button id="new-btn" type="button">New Game</button>
    </section>

    <p class="result" id="msg" aria-live="assertive"></p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
